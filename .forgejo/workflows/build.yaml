name: Build and Push

on: [push]

env:
  REGISTRY: registrypush.benliven.cloud
  KANIKO_NS: forgejo-runner

jobs:
  test:
    runs-on: go
    steps:
      - name: Checkout
        run: |
          SERVER_HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "${GITHUB_SERVER_URL%%://*}://oauth2:${GITHUB_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"
      - name: Test
        run: |
          export GOPATH=/data/.cache/gopath
          export GOCACHE=/data/.cache/gobuild
          go test ./...

  build-and-push:
    runs-on: go
    needs: test
    strategy:
      matrix:
        target: [agent, controller, prober]
    steps:
      - name: Build and push with Kaniko
        run: |
          POD_NAME="kaniko-${{ matrix.target }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"

          # Build destination flags
          DEST="--destination=$REGISTRY/dns-${{ matrix.target }}:${{ github.sha }}"
          DEST_LATEST=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DEST_LATEST="--destination=$REGISTRY/dns-${{ matrix.target }}:latest"
          fi

          # Spawn Kaniko pod in forgejo-runner namespace
          cat <<EOFPOD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${POD_NAME}
            namespace: ${KANIKO_NS}
          spec:
            restartPolicy: Never
            imagePullSecrets:
              - name: regcred
            containers:
              - name: kaniko
                image: registry.benliven.cloud/kaniko:slim-1.25.12
                args:
                  - --dockerfile=Dockerfile
                  - --context=git://forge.benliven.cloud/${GITHUB_REPOSITORY}.git#refs/heads/${GITHUB_REF_NAME}
                  - --target=${{ matrix.target }}
                  - ${DEST}
                  - ${DEST_LATEST}
                env:
                  - name: DOCKER_CONFIG
                    value: "/kaniko/.docker"
                  - name: GIT_TOKEN
                    value: "${GITHUB_TOKEN}"
                volumeMounts:
                  - name: docker-config
                    mountPath: /kaniko/.docker
            volumes:
              - name: docker-config
                secret:
                  secretName: pushcred
                  items:
                    - key: .dockerconfigjson
                      path: config.json
          EOFPOD

          # Stream logs once container starts
          echo "Waiting for Kaniko pod..."
          kubectl wait pod/${POD_NAME} -n ${KANIKO_NS} \
            --for=condition=Ready --timeout=120s 2>/dev/null || true
          kubectl logs -f pod/${POD_NAME} -n ${KANIKO_NS} 2>/dev/null || true

          # Check final status
          kubectl wait pod/${POD_NAME} -n ${KANIKO_NS} \
            --for=jsonpath='{.status.phase}'=Succeeded \
            --timeout=600s
          EXIT=$?

          # Cleanup
          kubectl delete pod ${POD_NAME} -n ${KANIKO_NS} --ignore-not-found

          if [ $EXIT -ne 0 ]; then
            echo "Kaniko build failed"
            exit 1
          fi
