name: Build and Push

on: [push]

env:
  REGISTRY: registrypush.benliven.cloud
  KANIKO_NS: forgejo-runner

jobs:
  test:
    runs-on: go
    steps:
      - name: Checkout
        run: |
          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SERVER_HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$REF" \
            "${GITHUB_SERVER_URL%%://*}://oauth2:${GITHUB_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"
      - name: Test
        run: |
          export GOPATH=/data/.cache/gopath
          export GOCACHE=/data/.cache/gobuild
          go test ./...

  build-and-push:
    runs-on: go
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        target: [agent, controller, prober]
    steps:
      - name: Build and push with Kaniko
        run: |
          POD_NAME="kaniko-${{ matrix.target }}-${GITHUB_RUN_ID}"

          # Build destination flags
          DEST="--destination=$REGISTRY/dns-${{ matrix.target }}:${{ github.sha }}"
          DEST_LATEST=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DEST_LATEST="--destination=$REGISTRY/dns-${{ matrix.target }}:latest"
          fi

          # Debug: inspect the pushcred secret
          echo "=== Secret type and keys ==="
          kubectl get secret pushcred -n ${KANIKO_NS} -o jsonpath='type={.type} keys={.data}' | sed 's/"[A-Za-z0-9+/=]*"/"<REDACTED>"/g'
          echo ""
          echo "=== Decoded config structure (values redacted) ==="
          kubectl get secret pushcred -n ${KANIKO_NS} -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for k,v in d.get('auths',{}).items():
            print(f'  registry: {k}')
            print(f'  fields: {list(v.keys())}')
          " 2>/dev/null || echo "  (could not parse as JSON)"
          echo ""

          # Spawn Kaniko pod in forgejo-runner namespace
          cat <<EOFPOD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${POD_NAME}
            namespace: ${KANIKO_NS}
          spec:
            restartPolicy: Never
            imagePullSecrets:
              - name: regcred
            containers:
              - name: kaniko
                image: registry.benliven.cloud/kaniko:slim-1.25.12
                args:
                  - --dockerfile=Dockerfile
                  - --context=git://forge.benliven.cloud/${GITHUB_REPOSITORY}.git#refs/heads/${GITHUB_REF_NAME}
                  - --target=${{ matrix.target }}
                  - --verbosity=trace
                  - ${DEST}
                  - ${DEST_LATEST}
                env:
                  - name: GIT_TOKEN
                    value: "${GITHUB_TOKEN}"
                volumeMounts:
                  - name: docker-config
                    mountPath: /kaniko/.docker
            volumes:
              - name: docker-config
                secret:
                  secretName: pushcred
                  items:
                    - key: .dockerconfigjson
                      path: config.json
          EOFPOD

          # Debug: check pod spec and volume mount status
          echo "=== Pod volume mounts ==="
          kubectl get pod ${POD_NAME} -n ${KANIKO_NS} -o jsonpath='{.spec.containers[0].volumeMounts}' 2>/dev/null | python3 -m json.tool 2>/dev/null || true
          echo ""
          echo "=== Pod volumes ==="
          kubectl get pod ${POD_NAME} -n ${KANIKO_NS} -o jsonpath='{.spec.volumes}' 2>/dev/null | python3 -m json.tool 2>/dev/null || true
          echo ""
          echo "=== Pod events ==="
          kubectl describe pod ${POD_NAME} -n ${KANIKO_NS} 2>/dev/null | grep -A 20 "Events:" || true
          echo ""

          # Stream logs once container starts
          echo "Waiting for Kaniko pod..."
          kubectl wait pod/${POD_NAME} -n ${KANIKO_NS} \
            --for=condition=Ready --timeout=120s 2>/dev/null || true
          kubectl logs -f pod/${POD_NAME} -n ${KANIKO_NS} 2>/dev/null || true

          # Check final status
          kubectl wait pod/${POD_NAME} -n ${KANIKO_NS} \
            --for=jsonpath='{.status.phase}'=Succeeded \
            --timeout=600s
          EXIT=$?

          # Cleanup
          kubectl delete pod ${POD_NAME} -n ${KANIKO_NS} --ignore-not-found

          if [ $EXIT -ne 0 ]; then
            echo "Kaniko build failed"
            exit 1
          fi
