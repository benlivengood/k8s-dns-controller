name: Build and Push

on: [push]

env:
  REGISTRY: registry.benliven.cloud

jobs:
  test:
    runs-on: go
    steps:
      - name: Checkout
        run: |
          SERVER_HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "${GITHUB_SERVER_URL%%://*}://oauth2:${GITHUB_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"
      - run: go test ./...

  build-and-push:
    runs-on: go
    needs: test
    strategy:
      matrix:
        target: [agent, controller, prober]
    steps:
      - name: Checkout
        run: |
          SERVER_HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "${GITHUB_SERVER_URL%%://*}://oauth2:${GITHUB_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"

      - name: Build and push
        run: |
          # Set up registry credentials
          mkdir -p /kaniko/.docker
          echo '{"auths":{"'"$REGISTRY"'":{"username":"${{ secrets.REGISTRY_USER }}","password":"${{ secrets.REGISTRY_PASSWORD }}"}}}' \
            > /kaniko/.docker/config.json

          DESTINATIONS="--destination $REGISTRY/dns-${{ matrix.target }}:${{ github.sha }}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DESTINATIONS="$DESTINATIONS --destination $REGISTRY/dns-${{ matrix.target }}:latest"
          fi

          executor \
            --dockerfile Dockerfile \
            --context . \
            --target ${{ matrix.target }} \
            $DESTINATIONS