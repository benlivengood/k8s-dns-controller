name: Build and Push

on: [push]

env:
  REGISTRY: registry.benliven.cloud

jobs:
  test:
    runs-on: go
    steps:
      - name: Checkout
        run: |
          SERVER_HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "${GITHUB_SERVER_URL%%://*}://oauth2:${GITHUB_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"
      - run: go test ./...

  build-and-push:
    runs-on: go
    needs: test
    strategy:
      matrix:
        target: [agent, controller, prober]
    steps:
      - name: Checkout
        run: |
          SERVER_HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "${GITHUB_SERVER_URL%%://*}://oauth2:${GITHUB_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"

      - name: Login to registry
        run: |
          buildah login \
            -u "${{ secrets.REGISTRY_USER }}" \
            -p "${{ secrets.REGISTRY_PASSWORD }}" \
            "$REGISTRY"

      - name: Build image
        run: |
          buildah bud \
            --storage-driver vfs \
            --target ${{ matrix.target }} \
            -t "$REGISTRY/dns-${{ matrix.target }}:${{ github.sha }}" .

      - name: Tag latest
        if: github.ref == 'refs/heads/main'
        run: |
          buildah tag \
            --storage-driver vfs \
            "$REGISTRY/dns-${{ matrix.target }}:${{ github.sha }}" \
            "$REGISTRY/dns-${{ matrix.target }}:latest"

      - name: Push SHA tag
        run: |
          buildah push \
            --storage-driver vfs \
            --creds "${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}" \
            "$REGISTRY/dns-${{ matrix.target }}:${{ github.sha }}"

      - name: Push latest
        if: github.ref == 'refs/heads/main'
        run: |
          buildah push \
            --storage-driver vfs \
            --creds "${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}" \
            "$REGISTRY/dns-${{ matrix.target }}:latest"