name: Build and Push

on: [push]

env:
  REGISTRY: registrypush.benliven.cloud
  KANIKO_NS: forgejo-runner

jobs:
  test:
    runs-on: go
    steps:
      - name: Checkout
        run: |
          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SERVER_HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$REF" \
            "${GITHUB_SERVER_URL%%://*}://oauth2:${GITHUB_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"
      - name: Test
        run: |
          export GOPATH=/data/.cache/gopath
          export GOCACHE=/data/.cache/gobuild
          go test ./...

  build-and-push:
    runs-on: go
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        target: [agent, controller, prober]
    steps:
      - name: Build and push with Kaniko
        run: |
          POD_NAME="kaniko-${{ matrix.target }}-${GITHUB_RUN_ID}"

          # Build destination flags
          DEST="--destination=$REGISTRY/dns-${{ matrix.target }}:${{ github.sha }}"
          DEST_LATEST=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DEST_LATEST="--destination=$REGISTRY/dns-${{ matrix.target }}:latest"
          fi

          # Spawn Kaniko pod in forgejo-runner namespace
          cat <<EOFPOD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${POD_NAME}
            namespace: ${KANIKO_NS}
          spec:
            restartPolicy: Never
            imagePullSecrets:
              - name: regcred
            containers:
              - name: kaniko
                image: registry.benliven.cloud/kaniko:debug
                command: ["/busybox/sh", "-c"]
                args:
                  - |
                    echo "=== /kaniko/.docker contents ==="
                    ls -la /kaniko/.docker/ 2>&1 || echo "DIR NOT FOUND"
                    echo "=== config.json ==="
                    cat /kaniko/.docker/config.json 2>&1 | sed 's/"auth":"[^"]*"/"auth":"REDACTED"/;s/"password":"[^"]*"/"password":"REDACTED"/' || echo "FILE NOT FOUND"
                    echo "=== DOCKER_CONFIG ==="
                    echo "$DOCKER_CONFIG"
                    echo "=== Running executor ==="
                    /kaniko/executor --dockerfile=Dockerfile --context=git://forge.benliven.cloud/${GITHUB_REPOSITORY}.git#refs/heads/${GITHUB_REF_NAME} --target=${{ matrix.target }} --verbosity=trace ${DEST} ${DEST_LATEST}
                env:
                  - name: DOCKER_CONFIG
                    value: "/kaniko/.docker"
                  - name: GIT_TOKEN
                    value: "${GITHUB_TOKEN}"
                volumeMounts:
                  - name: docker-config
                    mountPath: /kaniko/.docker
            volumes:
              - name: docker-config
                secret:
                  secretName: pushcred
                  items:
                    - key: .dockerconfigjson
                      path: config.json
          EOFPOD

          # Debug: check pod spec and volume mount status
          echo "=== Pod volume mounts ==="
          kubectl get pod ${POD_NAME} -n ${KANIKO_NS} -o jsonpath='{.spec.containers[0].volumeMounts}' 2>/dev/null | python3 -m json.tool 2>/dev/null || true
          echo ""
          echo "=== Pod volumes ==="
          kubectl get pod ${POD_NAME} -n ${KANIKO_NS} -o jsonpath='{.spec.volumes}' 2>/dev/null | python3 -m json.tool 2>/dev/null || true
          echo ""
          echo "=== Pod events ==="
          kubectl describe pod ${POD_NAME} -n ${KANIKO_NS} 2>/dev/null | grep -A 20 "Events:" || true
          echo ""

          # Stream logs once container starts
          echo "Waiting for Kaniko pod..."
          kubectl wait pod/${POD_NAME} -n ${KANIKO_NS} \
            --for=condition=Ready --timeout=120s 2>/dev/null || true
          kubectl logs -f pod/${POD_NAME} -n ${KANIKO_NS} 2>/dev/null || true

          # Check final status
          kubectl wait pod/${POD_NAME} -n ${KANIKO_NS} \
            --for=jsonpath='{.status.phase}'=Succeeded \
            --timeout=600s
          EXIT=$?

          # Cleanup
          kubectl delete pod ${POD_NAME} -n ${KANIKO_NS} --ignore-not-found

          if [ $EXIT -ne 0 ]; then
            echo "Kaniko build failed"
            exit 1
          fi
