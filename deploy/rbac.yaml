apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-dns-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: k8s-dns-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-dns-controller
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["node-public-ips"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]  # needed for initial creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-dns-controller
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: k8s-dns-controller
    namespace: kube-system
roleRef:
  kind: Role
  name: k8s-dns-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-dns-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-dns-controller
subjects:
  - kind: ServiceAccount
    name: k8s-dns-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: k8s-dns-controller
  apiGroup: rbac.authorization.k8s.io
